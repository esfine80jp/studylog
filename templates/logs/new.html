{% extends "base.html" %}
{% block title %}記録の追加 - StudyLog{% endblock %}
{% block content %}
<h1>記録の追加</h1>

<form action="/logs/new" method="post" class="col-md-6">
  <div class="mb-3">
    <label class="form-label" for="date">日付</label>
    <input type="date" name="date" id="date" class="form-control" required>
  </div>
  <div class="mb-3">
    <label class="form-label" for="subject_id">科目</label>
    <select name="subject_id" id="subject_id" class="form-select" required>
      {% for s in subjects %}
      <option value="{{ s['id'] }}">{{ s["name"] }}</option>
      {% endfor %}
    </select>
  </div>

  <div class="mb-3">
    <label class="form-label" for="hours">学習時間</label>
    <div class="input-group">
      <input type="number" name="hours" id="hours" class="form-control" min="0" value="0">
      <span class="input-group-text">時間</span>
      <input type="number" name="mins" id="mins" class="form-control" min="0" max="59" value="0">
      <span class="input-group-text">分</span>
    </div>
  </div>
  <div class="mb-3">
    <label class="form-label" for="memo">メモ</label>
    <textarea name="memo" id="memo" class="form-control" rows="2"></textarea>
  </div>
  <button class="btn btn-primary">追加する</button>
  <a href="/logs" class="btn btn-link">一覧に戻る</a>
</form>
{% endblock %}
