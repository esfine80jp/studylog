<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}StudyLog{% endblock %}</title>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" href="/">StudyLog</a>
    {% if current_user.is_authenticated %}
    <div class="navbar-nav ms-auto">
      <a class="nav-link" href="/logs">記録一覧</a>
      <a class="nav-link" href="/subjects">科目</a>
      <a class="nav-link" href="/goals">目標</a>
      <form action="/logout" method="post" class="d-inline">
        <button class="btn btn-sm btn-outline-light ms-2">ログアウト</button>
      </form>
    </div>
    {% endif %}
  </div>
</nav>

<div class="container mt-4">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
      <div class="alert alert-{{ category }}">{{ message }}</div>
    {% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</div>
</body>
</html>
